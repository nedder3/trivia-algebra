name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying static content
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build site (copy only required web assets)
        run: |
          mkdir _site
          cp index.html _site/
          cp style.css _site/
          cp app.js _site/
          cp questions.js _site/
          cp tablas_de_verdad_2_variables.html _site/
          cp tablas_de_verdad_2_variables.pdf _site/
          cp reduccion_al_absurdo_guia.html _site/
          cp reduccion_al_absurdo_guia.pdf _site/
          cp simulacro_resuelto.html _site/
          cp simulacro_resuelto.pdf _site/
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
